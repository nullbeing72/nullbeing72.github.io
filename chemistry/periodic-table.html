<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Periodic Table — Elemental</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e14; --bg2:#0f1520; --panel:#121a26; --panel2:#161f2d;
  --line:#233043; --line-soft:#1a2534;
  --ink:#e8edf5; --ink-dim:#8fa1b8; --ink-faint:#5c6d84;
  --accent:#5eead4; --accent-ink:#04241d;
  --amber:#f5b942;
  --shadow: 0 24px 60px -20px rgba(0,0,0,.6);

  --c-alkali-metal:#ff7a7a;      --c-alkali-metal-soft:#3a1f22;
  --c-alkaline-earth:#ffb15c;    --c-alkaline-earth-soft:#3a2a18;
  --c-transition-metal:#5eb3ff;  --c-transition-metal-soft:#182a3a;
  --c-post-transition:#5ee6b8;   --c-post-transition-soft:#153327;
  --c-metalloid:#c39bff;         --c-metalloid-soft:#271c3a;
  --c-nonmetal:#8ee06a;          --c-nonmetal-soft:#1e2f18;
  --c-halogen:#f5e06a;           --c-halogen-soft:#332e15;
  --c-noble-gas:#63dfe8;         --c-noble-gas-soft:#153033;
  --c-lanthanide:#f793c1;        --c-lanthanide-soft:#331c28;
  --c-actinide:#e39bf7;          --c-actinide-soft:#2c1c33;
  --c-unknown:#93a2b8;           --c-unknown-soft:#1e2530;
}
html.light{
  --bg:#f3efe4; --bg2:#ece5d3; --panel:#fbf9f2; --panel2:#f4efe1;
  --line:#d9d0b8; --line-soft:#e6dfc9;
  --ink:#241f16; --ink-dim:#5a5240; --ink-faint:#8a8064;
  --accent:#0f7a68; --accent-ink:#f3efe4;
  --amber:#a8681a;
  --shadow: 0 24px 50px -20px rgba(60,50,20,.25);

  --c-alkali-metal:#c4402f;      --c-alkali-metal-soft:#f6ddd6;
  --c-alkaline-earth:#b06817;    --c-alkaline-earth-soft:#f3e2c8;
  --c-transition-metal:#1c6fb0;  --c-transition-metal-soft:#d9e8f4;
  --c-post-transition:#12805f;   --c-post-transition-soft:#d3ede2;
  --c-metalloid:#6c3fc9;         --c-metalloid-soft:#e5dbf7;
  --c-nonmetal:#437a1f;          --c-nonmetal-soft:#dfeecf;
  --c-halogen:#9c7f0c;           --c-halogen-soft:#f0e7c4;
  --c-noble-gas:#0e8791;         --c-noble-gas-soft:#d2eef0;
  --c-lanthanide:#b13d74;        --c-lanthanide-soft:#f5dbe8;
  --c-actinide:#8236a3;          --c-actinide-soft:#ecdbf5;
  --c-unknown:#5b6577;           --c-unknown-soft:#e1e4ea;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 1200px 600px at 15% -10%, var(--bg2), transparent),
    var(--bg);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  transition:background .35s ease, color .35s ease;
}
.mono{font-family:'JetBrains Mono',monospace;}
.display{font-family:'Fraunces',serif;}

::selection{background:var(--accent);color:var(--accent-ink);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}

/* ===== Header ===== */
.app{max-width:1400px;margin:0 auto;padding:28px 22px 80px;}
.hero{
  display:flex; align-items:flex-end; justify-content:space-between; gap:24px;
  flex-wrap:wrap; margin-bottom:22px; padding-bottom:22px; border-bottom:1px solid var(--line-soft);
}
.hero-title{display:flex; flex-direction:column; gap:6px;}
.eyebrow{
  font-family:'JetBrains Mono',monospace; font-size:11.5px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--accent); display:flex; align-items:center; gap:8px;
}
.eyebrow::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);}
h1.display{font-size:44px; margin:0; font-weight:600; letter-spacing:-.01em; line-height:1;}
.hero-sub{color:var(--ink-dim); font-size:14.5px; max-width:520px; margin-top:2px;}

.hero-controls{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.search-wrap{position:relative;}
.search-wrap input{
  width:280px; background:var(--panel); border:1px solid var(--line); color:var(--ink);
  border-radius:10px; padding:11px 14px 11px 38px; font-size:14px; font-family:'Inter',sans-serif;
  outline:none; transition:border-color .2s, box-shadow .2s;
}
.search-wrap input:focus{border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);}
.search-wrap svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); opacity:.55; pointer-events:none;}
.search-scan{position:absolute; left:1px; right:1px; top:1px; bottom:1px; border-radius:9px; pointer-events:none; overflow:hidden;}

.icon-btn{
  width:40px;height:40px;border-radius:10px;border:1px solid var(--line); background:var(--panel);
  color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer;
  transition:border-color .2s, transform .15s, background .2s;
}
.icon-btn:hover{border-color:var(--accent); transform:translateY(-1px);}
.icon-btn svg{width:18px;height:18px;}

/* ===== Category filter strip ===== */
.category-strip{
  display:flex; flex-wrap:wrap; gap:8px; margin-bottom:24px;
}
.cat-chip{
  display:flex; align-items:center; gap:7px; padding:7px 12px 7px 9px; border-radius:999px;
  border:1px solid var(--line); background:var(--panel); cursor:pointer; font-size:12.5px; color:var(--ink-dim);
  transition:all .18s ease; user-select:none;
}
.cat-chip .dot{width:9px;height:9px;border-radius:50%;flex:none;}
.cat-chip:hover{border-color:var(--ink-faint); color:var(--ink);}
.cat-chip.active{background:var(--chip-soft); border-color:var(--chip-color); color:var(--ink); font-weight:500;}
.cat-chip.clear{margin-left:2px;}

/* ===== Table grid ===== */
.table-scroll{width:100%; overflow-x:auto; padding-bottom:8px;}
.ptable{
  display:grid;
  grid-template-columns:repeat(18, minmax(52px,1fr));
  gap:5px;
  min-width:1040px;
}
.ptable.f-gap{margin-top:14px;}
.cell{ aspect-ratio:1/1; }
.tile{
  height:100%; width:100%; border-radius:8px; border:1px solid var(--line);
  background:var(--panel); cursor:pointer; padding:6px 7px 5px; position:relative;
  display:flex; flex-direction:column; justify-content:space-between;
  transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease, background .14s ease;
  overflow:hidden;
}
.tile::before{
  content:''; position:absolute; inset:0; opacity:0; background:var(--tile-color); transition:opacity .14s ease;
}
.tile:hover{ transform:translateY(-3px) scale(1.045); z-index:5; box-shadow:var(--shadow); border-color:var(--tile-color); }
.tile:hover::before{opacity:.14;}
.tile.dimmed{opacity:.22; filter:saturate(.3);}
.tile.dimmed:hover{transform:none; box-shadow:none;}
.tile-num{font-family:'JetBrains Mono',monospace; font-size:9.5px; color:var(--ink-faint); position:relative;}
.tile-sym{font-family:'Fraunces',serif; font-weight:600; font-size:19px; line-height:1; position:relative;}
.tile-name{font-size:7.6px; color:var(--ink-dim); position:relative; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.tile-mass{font-family:'JetBrains Mono',monospace; font-size:7.5px; color:var(--ink-faint); position:relative;}
.tile-bar{position:absolute; left:0; right:0; bottom:0; height:3px; background:var(--tile-color);}
.cell.ph{visibility:hidden;}
.lant-marker,.act-marker{
  display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:9px;
  color:var(--ink-faint); border:1px dashed var(--line); border-radius:8px;
}

/* ===== Legend footer note ===== */
.legend-note{margin-top:16px; font-size:12px; color:var(--ink-faint); display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.legend-note b{color:var(--ink-dim); font-weight:600;}

/* ===== Modal base ===== */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(4,7,12,.6); backdrop-filter:blur(6px);
  display:flex; align-items:center; justify-content:center; z-index:100; opacity:0;
  transition:opacity .22s ease; padding:20px;
}
html.light .modal-backdrop{background:rgba(40,32,16,.35);}
.modal-backdrop.show{opacity:1;}
.modal-backdrop.hide-instant{display:none;}

.modal{
  background:var(--panel); border:1px solid var(--line); border-radius:18px; width:100%; max-width:600px;
  max-height:88vh; overflow-y:auto; transform:translateY(18px) scale(.98); opacity:0;
  transition:transform .28s cubic-bezier(.2,.8,.2,1), opacity .24s ease; box-shadow:var(--shadow);
}
.modal-backdrop.show .modal{transform:translateY(0) scale(1); opacity:1;}

.modal-head{
  padding:26px 26px 20px; display:flex; gap:20px; align-items:flex-start; position:relative;
  border-bottom:1px solid var(--line-soft);
}
.modal-head-bg{position:absolute; inset:0; opacity:.10; pointer-events:none;}
.modal-symbol{
  width:78px;height:78px; border-radius:16px; display:flex; align-items:center; justify-content:center;
  font-family:'Fraunces',serif; font-weight:700; font-size:34px; flex:none; position:relative; border:1px solid var(--line);
}
.modal-titles{position:relative;}
.modal-titles .eyebrow{margin-bottom:4px;}
.modal-titles h2{margin:0; font-size:28px; font-weight:600;}
.modal-titles .sub{color:var(--ink-dim); font-size:13.5px; margin-top:4px;}
.modal-close{position:absolute; top:16px; right:16px; }

.modal-body{padding:22px 26px 28px;}
.section-label{
  font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--accent); margin:20px 0 10px;
}
.section-label:first-child{margin-top:0;}
.fact-box{
  background:var(--panel2); border:1px solid var(--line-soft); border-radius:12px; padding:14px 16px;
  font-size:13.5px; line-height:1.55; color:var(--ink-dim); font-style:italic; font-family:'Fraunces',serif;
}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.stat{
  background:var(--panel2); border:1px solid var(--line-soft); border-radius:10px; padding:10px 12px;
}
.stat .k{font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; margin-bottom:3px;}
.stat .v{font-size:14px; font-family:'JetBrains Mono',monospace; color:var(--ink);}
.pill-row{display:flex; flex-wrap:wrap; gap:7px;}
.pill{
  background:var(--panel2); border:1px solid var(--line-soft); border-radius:999px; padding:6px 12px; font-size:12.5px;
  color:var(--ink-dim);
}
ul.uses{margin:0; padding-left:18px; font-size:13.5px; color:var(--ink-dim); line-height:1.75;}

.more-btn{
  margin-top:24px; width:100%; padding:13px; border-radius:12px; border:1px solid var(--accent);
  background:transparent; color:var(--accent); font-family:'JetBrains Mono',monospace; font-size:12.5px;
  letter-spacing:.08em; text-transform:uppercase; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  transition:background .18s, color .18s;
}
.more-btn:hover{background:var(--accent); color:var(--accent-ink);}

/* ===== Detail modal (full screen) ===== */
.detail-backdrop{ position:fixed; inset:0; background:var(--bg); z-index:200; opacity:0; pointer-events:none; transition:opacity .26s ease;}
.detail-backdrop.show{opacity:1; pointer-events:all;}
.detail-wrap{max-width:1080px; margin:0 auto; padding:24px 24px 100px; height:100vh; overflow-y:auto;}
.detail-topbar{
  position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:space-between;
  padding:14px 0; margin-bottom:8px; background:linear-gradient(var(--bg) 70%, transparent);
}
.back-link{display:flex; align-items:center; gap:8px; color:var(--ink-dim); cursor:pointer; font-size:13.5px; font-family:'JetBrains Mono',monospace;}
.back-link:hover{color:var(--ink);}

.detail-hero{display:flex; gap:26px; align-items:center; padding:22px 0 26px; flex-wrap:wrap;}
.detail-symbol{
  width:110px;height:110px;border-radius:22px; display:flex; align-items:center;justify-content:center;
  font-family:'Fraunces',serif; font-weight:700; font-size:48px; border:1px solid var(--line); flex:none; position:relative; overflow:hidden;
}
.detail-hero h1{font-size:40px; margin:0 0 4px;}
.detail-hero .sub{color:var(--ink-dim); font-size:14px;}

.tabs{display:flex; gap:6px; flex-wrap:wrap; border-bottom:1px solid var(--line-soft); margin-bottom:22px; padding-bottom:0;}
.tab{
  padding:10px 16px; font-size:13px; font-family:'JetBrains Mono',monospace; color:var(--ink-faint); cursor:pointer;
  border-bottom:2px solid transparent; letter-spacing:.02em;
}
.tab:hover{color:var(--ink-dim);}
.tab.active{color:var(--accent); border-bottom-color:var(--accent);}
.tab-panel{display:none; animation:fadein .25s ease;}
.tab-panel.active{display:block;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px 22px; margin-bottom:16px;}
.card h3{margin:0 0 10px; font-size:15px; font-family:'Fraunces',serif; font-weight:600;}
.card p{margin:0; font-size:14px; line-height:1.7; color:var(--ink-dim);}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media(max-width:720px){.two-col{grid-template-columns:1fr;}}

.iso-table{width:100%; border-collapse:collapse; font-size:13px;}
.iso-table th{text-align:left; font-family:'JetBrains Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); padding:8px 10px; border-bottom:1px solid var(--line-soft);}
.iso-table td{padding:10px 10px; border-bottom:1px solid var(--line-soft); color:var(--ink-dim);}
.iso-table td:first-child{font-family:'JetBrains Mono',monospace; color:var(--ink); font-weight:600;}

/* reactions db */
.rxn-controls{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
.rxn-controls input, .rxn-controls select{
  background:var(--panel2); border:1px solid var(--line); color:var(--ink); border-radius:9px; padding:9px 12px; font-size:13px;
  font-family:'Inter',sans-serif; outline:none;
}
.rxn-controls input:focus, .rxn-controls select:focus{border-color:var(--accent);}
.rxn-count{font-size:12px; color:var(--ink-faint); margin-bottom:10px; font-family:'JetBrains Mono',monospace;}
.rxn-item{padding:12px 14px; border:1px solid var(--line-soft); border-radius:10px; margin-bottom:8px; background:var(--panel2);}
.rxn-eq{font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--ink); margin-bottom:4px;}
.rxn-meta{font-size:12px; color:var(--ink-faint); display:flex; gap:14px; flex-wrap:wrap;}
.rxn-meta span b{color:var(--ink-dim); font-weight:500;}
.rxn-empty{color:var(--ink-faint); font-size:13px; padding:20px; text-align:center;}

.related-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(90px,1fr)); gap:10px;}
.related-tile{
  border:1px solid var(--line); border-radius:10px; padding:10px; text-align:center; cursor:pointer; background:var(--panel2);
  transition:border-color .15s, transform .15s;
}
.related-tile:hover{transform:translateY(-2px);}
.related-tile .sym{font-family:'Fraunces',serif; font-size:20px; font-weight:600;}
.related-tile .nm{font-size:9.5px; color:var(--ink-faint); margin-top:2px;}

.tag-note{font-size:12px; color:var(--ink-faint); line-height:1.6; margin-top:2px;}

.empty-state{text-align:center; padding:70px 20px; color:var(--ink-faint);}
.empty-state svg{opacity:.4; margin-bottom:14px;}

@media(max-width:640px){
  h1.display{font-size:32px;}
  .modal{border-radius:14px;}
  .modal-symbol{width:64px;height:64px;font-size:26px;}
  .detail-symbol{width:84px;height:84px;font-size:34px;}
  .detail-hero h1{font-size:28px;}
  .grid2{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="app">

  <div class="hero">
    <div class="hero-title">
      <div class="eyebrow">Interactive Reference · 118 Elements</div>
      <h1 class="display">The Periodic Table</h1>
      <div class="hero-sub">Click any element for physical &amp; chemical data, discovery history, isotopes, and a searchable reaction library.</div>
    </div>
    <div class="hero-controls">
      <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="Search name, symbol, or number…" autocomplete="off">
      </div>
      <button class="icon-btn" id="themeToggle" title="Toggle dark / light mode" aria-label="Toggle theme"></button>
    </div>
  </div>

  <div class="category-strip" id="categoryStrip"></div>

  <div class="table-scroll">
    <div class="ptable" id="ptable"></div>
    <div class="ptable f-gap" id="ptableF"></div>
  </div>

  <div class="legend-note"><b>Tip:</b> Use the search bar or category chips above to filter the table. Grey tiles are dimmed but still clickable.</div>
</div>

<!-- Quick info modal -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalCard" role="dialog" aria-modal="true"></div>
</div>

<!-- Full detail view -->
<div class="detail-backdrop" id="detailBackdrop">
  <div class="detail-wrap" id="detailWrap"></div>
</div>

lat brines.","biological":"Not essential to humans in trace amounts, but lithium carbonate is used therapeutically for bipolar disorder.","hazards":"Reacts vigorously with water and moisture; can cause skin/eye burns; fire risk with battery cells.","isotopes":[{"sym":"⁶Li","name":"Lithium-6","abund":"7.6%","notes":"Stable"},{"sym":"⁷Li","name":"Lithium-7","abund":"92.4%","notes":"Stable, most abundant"}],"reactions":[{"eq":"2Li + 2H₂O → 2LiOH + H₂","cond":"Room temperature","note":"Reacts with water, less violently than Na"},{"eq":"4Li + O₂ → 2Li₂O","cond":"Air exposure","note":"Slow surface oxidation"},{"eq":"2Li + Cl₂ → 2LiCl","cond":"Direct combination","note":"Forms lithium chloride"}],"discoveryHow":"Discovered in 1817 by Johan August Arfvedson, who identified a new alkali metal while analyzing the mineral petalite and noticed it produced a distinct reaction pattern unlike sodium or potassium salts. The pure metal was later isolated by electrolysis of lithium chloride by W.T. Brande and Humphry Davy."},{"z":4,"sym":"Be","name":"Beryllium","mass":"9.0122","cat":"alkaline-earth","per":2,"grp":2,"block":"s","config":"[He] 2s²","state":"Solid","density":"1.85 g/cm³","mp":"1287","bp":"2469","appearance":"Steel-gray, hard, brittle metal","valency":2,"oxidation":"+2","eneg":"1.57","discoverer":"Louis Nicolas Vauquelin","year":1798,"uses":["Aerospace alloys","X-ray windows","Nuclear reactor components","Gyroscopes and precision instruments"],"fact":"Beryllium is one of the lightest structural metals yet has an extremely high melting point, prized in aerospace.","occurrence":"Found in minerals such as beryl (which also forms emerald and aquamarine gemstones).","biological":"No known biological role; toxic to humans.","hazards":"Highly toxic; inhalation of dust/fumes can cause chronic beryllium disease; handled with strict controls.","isotopes":[{"sym":"⁹Be","name":"Beryllium-9","abund":"100%","notes":"Only stable isotope"}],"reactions":[{"eq":"Be + 2HCl → BeCl₂ + H₂","cond":"Dilute acid","note":"Reacts with acids"},{"eq":"Be + 2NaOH + 2H₂O → Na₂[Be(OH)₄] + H₂","cond":"Strong base","note":"Amphoteric behavior"}],"discoveryHow":"First identified in 1798 by Louis Nicolas Vauquelin, who found a new 'earth' (oxide) while chemically analyzing beryl and emerald gemstones. The metal itself was isolated independently in 1828 by Friedrich Wöhler and Antoine Bussy via reduction of beryllium chloride with potassium."},{"z":5,"sym":"B","name":"Boron","mass":"10.81","cat":"metalloid","per":2,"grp":13,"block":"p","config":"[He] 2s² 2p¹","state":"Solid","density":"2.34 g/cm³","mp":"2076","bp":"3927","appearance":"Black-brown, hard, brittle solid","valency":3,"oxidation":"+3","eneg":"2.04","discoverer":"Joseph Louis Gay-Lussac / Louis Jacques Thénard","year":1808,"uses":["Borosilicate glass (Pyrex)","Detergents and bleaches","Semiconductor doping","Fiberglass insulation"],"fact":"Boron compounds have been used since antiquity as borax for glassmaking and preservation.","occurrence":"Not found free in nature; occurs in borate minerals like borax and kernite in evaporite deposits.","biological":"Trace element beneficial to plant growth; possible role in human bone metabolism.","hazards":"Boron dust can irritate skin and respiratory tract; some boron compounds are reproductive toxicants.","isotopes":[{"sym":"¹⁰B","name":"Boron-10","abund":"19.9%","notes":"Stable, neutron absorber"},{"sym":"¹¹B","name":"Boron-11","abund":"80.1%","notes":"Stable, most abundant"}],"reactions":[{"eq":"4B + 3O₂ → 2B₂O₃","cond":"Heat","note":"Combustion in oxygen"},{"eq":"B₂O₃ + 3H₂O → 2H₃BO₃","cond":"Hydrolysis","note":"Forms boric acid"}],"discoveryHow":"Isolated in 1808 essentially simultaneously by Joseph Louis Gay-Lussac and Louis Jacques Thénard in France, and by Humphry Davy in England, all using the same basic method: reducing boric acid with potassium metal."},{"z":6,"sym":"C","name":"Carbon","mass":"12.011","cat":"nonmetal","per":2,"grp":14,"block":"p","config":" licates) and second most abundant in the atmosphere.","biological":"Essential for aerobic respiration in nearly all complex life forms.","hazards":"Supports combustion strongly; pure oxygen atmospheres greatly increase fire risk.","isotopes":[{"sym":"¹⁶O","name":"Oxygen-16","abund":"99.76%","notes":"Stable, most abundant"},{"sym":"¹⁷O","name":"Oxygen-17","abund":"0.04%","notes":"Stable"},{"sym":"¹⁸O","name":"Oxygen-18","abund":"0.20%","notes":"Stable, used in climate proxies"}],"reactions":[{"eq":"2H₂ + O₂ → 2H₂O","cond":"Spark","note":"Combustion"},{"eq":"S + O₂ → SO₂","cond":"Heat","note":"Combustion of sulfur"},{"eq":"4Fe + 3O₂ → 2Fe₂O₃","cond":"Moisture present","note":"Rusting"},{"eq":"3O₂ → 2O₃","cond":"UV light / electric discharge","note":"Ozone formation"}],"discoveryHow":"Independently isolated around 1771–1774 by Carl Wilhelm Scheele (who did not publish promptly) and 1774 by Joseph Priestley, both by heating mercuric oxide (HgO) and collecting the gas released, which they found made a candle burn brighter."},{"z":9,"sym":"F","name":"Fluorine","mass":"18.998","cat":"halogen","per":2,"grp":17,"block":"p","config":"[He] 2s² 2p⁵","state":"Gas","density":"1.696 g/L","mp":"-219.67","bp":"-188.11","appearance":"Pale yellow, corrosive gas","valency":1,"oxidation":"-1","eneg":"3.98","discoverer":"Henri Moissan","year":1886,"uses":["Toothpaste (fluoride) for cavity prevention","Teflon (PTFE) non-stick coatings","Refrigerants (fluorocarbons)","Uranium enrichment (UF₆)"],"fact":"Fluorine is the most reactive and electronegative element on the periodic table, reacting with almost everything including glass.","occurrence":"Never found free in nature; occurs in minerals such as fluorite and fluorapatite.","biological":"Fluoride ion strengthens tooth enamel; not otherwise essential but toxic in excess.","hazards":"Extremely toxic and corrosive gas; causes severe chemical burns; requires specialized handling equipment.","isotopes":[{"sym":"¹⁹F","name":"Fluorine-19","abun mined the last traces of gas remaining and identified new spectral lines distinct from argon."},{"z":11,"sym":"Na","name":"Sodium","mass":"22.990","cat":"alkali-metal","per":3,"grp":1,"block":"s","config":"[Ne] 3s¹","state":"Solid","density":"0.971 g/cm³","mp":"97.79","bp":"882.9","appearance":"Soft, silvery-white metal","valency":1,"oxidation":"+1","eneg":"0.93","discoverer":"Humphry Davy","year":1807,"uses":["Table salt (NaCl)","Street lighting (sodium vapor lamps)","Soap manufacturing","Heat transfer fluid in reactors"],"fact":"Sodium metal is so reactive it must be stored under oil, and it reacts explosively with water.","occurrence":"6th most abundant element in Earth's crust; widely found as halite (rock salt) and dissolved in seawater.","biological":"Essential electrolyte for nerve impulse transmission and fluid balance in living organisms.","hazards":"Reacts violently with water, releasing flammable hydrogen gas; can cause fires and skin burns.","isotopes":[{"sym":"²²Na","name":"Sodium-22","abund":"trace","notes":"Radioactive, t½≈2.6 yr, used in PET"},{"sym":"²³Na","name":"Sodium-23","abund":"100%","notes":"Only stable isotope"}],"reactions":[{"eq":"2Na + 2H₂O → 2NaOH + H₂","cond":"Room temperature","note":"Vigorous, exothermic"},{"eq":"2Na + Cl₂ → 2NaCl","cond":"Direct combination","note":"Forms table salt"},{"eq":"4Na + O₂ → 2Na₂O","cond":"Air exposure","note":"Surface oxidation"}],"discoveryHow":"Isolated in 1807 by Humphry Davy through electrolysis of molten caustic soda (sodium hydroxide), one of the first elements ever isolated by electric current."},{"z":12,"sym":"Mg","name":"Magnesium","mass":"24.305","cat":"alkaline-earth","per":3,"grp":2,"block":"s","config":"[Ne] 3s²","state":"Solid","density":"1.738 g/cm³","mp":"650","bp":"1090","appearance":"Shiny, silvery-white metal","valency":2,"oxidation":"+2","eneg":"1.31","discoverer":"Joseph Black","year":1755,"uses":["Lightweight alloys (aerospace, auto)","Fireworks and flares","Flash photography (historically)","Dietary supplements"],"fact":"Magnesium burns with an intensely bright white flame, once used in early photographic flash powder.","occurrence":"8th most abundant element in Earth's crust; abundant in seawater and minerals like dolomite and magnesite.","biological":"Essential cofactor for hundreds of enzymes and central atom of the chlorophyll molecule in plants.","hazards":"Highly flammable in powdered or ribbon form; burning magnesium cannot be extinguished with water.","isotopes":[{"sym":"²⁴Mg","name":"Magnesium-24","abund":"79%","notes":"Stable, most abundant"},{"sym":"²⁵Mg","name":"Magnesium-25","abund":"10%","notes":"Stable"},{"sym":"²⁶Mg","name":"Magnesium-26","abund":"11%","notes":"Stable"}],"reactions":[{"eq":"2Mg + O₂ → 2MgO","cond":"Ignition","note":"Bright white combustion"},{"eq":"Mg + 2HCl → MgCl₂ + H₂","cond":"Room temperature","note":"Reacts with dilute acids"},{"eq":"Mg + 2H₂O → Mg(OH)₂ + H₂","cond":"Steam","note":"Reacts with steam, slow with cold water"}],"discoveryHow":"Recognized as a distinct element by Joseph Black in 1755 through analysis of magnesia alba, though the pure metal was not isolated until 1808, when Humphry Davy obtained it by electrolysis of a mixture of magnesia and mercuric oxide."},{"z":13,"sym":"Al","name":"Aluminium","mass":"26.982","cat":"post-transition","per":3,"grp":13,"block":"p","config":"[Ne] 3s² 3p¹","state":"Solid","density":"2.70 g/cm³","mp":"660.32","bp":"2519","appearance":"Silvery-white, lightweight metal","valency":3,"oxidation":"+3","eneg":"1.61","discoverer":"Hans Christian Ørsted","year":1825,"uses":["Beverage cans and packaging","Aircraft and automotive parts","Electrical transmission cables","Construction materials"],"fact":"Aluminium is the most abundant metal in the Earth's crust, yet it was once more precious than gold before cheap extraction methods existed.","occurrence":"Most abundant metallic element in the Earth's crust; primarily extracted from bauxite ore via the Hall-Héroult process.","biological":"No known essential biological role in humans; large intakes can be neurotoxic.","hazards":"Fine aluminium powder is flammable and can form explosive dust clouds; generally safe as bulk metal.","isotopes":[{"sym":"²⁷Al","name":"Aluminium-27","abund":"100%","notes":"Only stable isotope"}],"reactions":[{"eq":"4Al + 3O₂ → 2Al₂O₃","cond":"Forms passivating oxide layer","note":"Protects metal from further corrosion"},{"eq":"2Al + 6HCl → 2AlCl₃ + 3H₂","cond":"Dilute acid","note":"Reacts with acids"},{"eq":"2Al + 2NaOH + 2H₂O → 2NaAlO₂ + 3H₂","cond":"Strong base","note":"Amphoteric behavior"},{"eq":"2Al + Fe₂O₃ → Al₂O₃ + 2Fe","cond":"Ignition (thermite)","note":"Highly exothermic thermite reaction"}],"discoveryHow":"First isolated in impure form in 1825 by Hans Christian Ørsted, who reduced aluminium chloride with potassium amalgam. Friedrich Wöhler improved the method in 1827, but aluminium remained a rare, precious curiosity until the Hall–Héroult electrolytic process was developed in 1886."},{"z":14,"sym":"Si","name":"Silicon","mass":"28.085","cat":"metalloid","per":3,"grp":14,"block":"p","config":"[Ne] 3s² 3p²","state":"Solid","density":"2.33 g/cm³","mp":"1414","bp":"3265","appearance":"Blue-grey, lustrous solid","valency":4,"oxidation":"+4,-4","eneg":"1.90","discoverer":"Jöns Jacob Berzelius","year":1824,"uses":["Computer chips and semiconductors","Solar photovoltaic cells","Glass and ceramics","Silicone polymers"],"fact":"Silicon is the second most abundant element in the Earth's crust, forming the backbone of modern electronics as the basis of computer chips.","occurrence":"Makes up about 27.7% of the Earth's crust by mass, primarily as silica and silicate minerals.","biological":"Trace beneficial role in connective tissue and bone in some organisms; not essential in humans.","hazards":"Crystalline silica dust can cause silicosis with prolonged inhalation exposure.","isotopes":[{"sym":"²⁸Si","name":"Silicon-28","abund":"92.2%","notes":"Stable, most abun <script>
(function(){
"use strict";

const DATA = JSON.parse(document.getElementById('element-data').textContent);
const byZ = {}; DATA.forEach(e => byZ[e.z] = e);

const CATS = [
  {key:'alkali-metal', label:'Alkali Metal'},
  {key:'alkaline-earth', label:'Alkaline Earth'},
  {key:'transition-metal', label:'Transition Metal'},
  {key:'post-transition', label:'Post-transition'},
  {key:'metalloid', label:'Metalloid'},
  {key:'nonmetal', label:'Reactive Nonmetal'},
  {key:'halogen', label:'Halogen'},
  {key:'noble-gas', label:'Noble Gas'},
  {key:'lanthanide', label:'Lanthanide'},
  {key:'actinide', label:'Actinide'},
  {key:'unknown', label:'Unknown'},
];

let activeCat = null;
let searchQuery = '';

// ---------- Theme ----------
const root = document.documentElement;
const themeBtn = document.getElementById('themeToggle');
function iconMoon(){return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';}
function iconSun(){return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';}
function setTheme(mode){
  if(mode==='light'){ root.classList.add('light'); themeBtn.innerHTML = iconMoon(); }
  else { root.classList.remove('light'); themeBtn.innerHTML = iconSun(); }
  localStorage._t = mode; // in-memory only fallback below
}
let currentTheme = 'dark';
try{
  const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  currentTheme = prefersLight ? 'light' : 'dark';
}catch(e){}
setTheme(currentTheme);
themeBtn.addEventListener('click', ()=>{
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  setTheme(currentTheme);
});

// ---------- Category strip ----------
const stripEl = document.getElementById('categoryStrip');
function renderStrip(){
  let html = '';
  CATS.forEach(c=>{
    const active = activeCat === c.key;
    html += `<div class="cat-chip ${active?'active':''}" data-cat="${c.key}"
      style="--chip-color:var(--c-${c.key}); --chip-soft:var(--c-${c.key}-soft);">
      <span class="dot" style="background:var(--c-${c.key})"></span>${c.label}
    </div>`;
  });
  html += `<div class="cat-chip clear" id="clearCat">Show all</div>`;
  stripEl.innerHTML = html;
  stripEl.querySelectorAll('.cat-chip[data-cat]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const k = el.getAttribute('data-cat');
      activeCat = (activeCat===k) ? null : k;
      renderStrip(); renderGrid();
    });
  });
  document.getElementById('clearCat').addEventListener('click', ()=>{
    activeCat = null; renderStrip(); renderGrid();
  });
}

// ---------- Grid ----------
const mainGrid = document.getElementById('ptable');
const fGrid = document.getElementById('ptableF');

function matches(e){
  if(activeCat && e.cat !== activeCat) return false;
  if(!searchQuery) return true;
  const q = searchQuery.toLowerCase();
  return e.name.toLowerCase().includes(q) || e.sym.toLowerCase().includes(q) || String(e.z) === q;
}

function tileHTML(e){
  const dim = !matches(e);
  return `<div class="cell" style="grid-column:${e.grp}; grid-row:${e.per};">
    <div class="tile ${dim?'dimmed':''}" data-z="${e.z}" style="--tile-color:var(--c-${e.cat});">
      <div class="tile-num mono">${e.z}</div>
      <div>
        <div class="tile-sym">${e.sym}</div>
        <div class="tile-name">${e.name}</div>
        <div class="tile-mass mono">${e.mass}</div>
      </div>
      <div class="tile-bar"></div>
    </div>
  </div>`;
}

function renderGrid(){
  const mainEls = DATA.filter(e => !(e.cat==='lanthanide' || e.cat==='actinide'));
  const lant = DATA.filter(e=>e.cat==='lanthanide').sort((a,b)=>a.z-b.z);
  const act = DATA.filter(e=>e.cat==='actinide').sort((a,b)=>a.z-b.z);

  let html = '';
  mainEls.forEach(e=> html += tileHTML(e));
  // placeholder markers for La/Ac in main grid row 6/7 col 3
  html += `<div class="cell" style="grid-column:3; grid-row:6;"><div class="lant-marker">57–71</div></div>`;
  html += `<div class="cell" style="grid-column:3; grid-row:7;"><div class="act-marker">89–103</div></div>`;
  mainGrid.innerHTML = html;

  let fhtml = '';
  lant.forEach(e=> fhtml += tileHTML(e));
  act.forEach(e=> fhtml += tileHTML(e));
  fGrid.innerHTML = fhtml;
  // fix grid rows for f-block (2 rows of 15)
  fGrid.querySelectorAll('.cell').forEach((c,i)=>{
    const row = i < 15 ? 1 : 2;
    const col = (i % 15) + 1;
    c.style.gridColumn = col;
    c.style.gridRow = row;
  });

  document.querySelectorAll('.tile').forEach(t=>{
    t.addEventListener('click', ()=> openQuick(parseInt(t.getAttribute('data-z'))));
  });
}

document.getElementById('searchInput').addEventListener('input', (ev)=>{
  searchQuery = ev.target.value.trim();
  renderGrid();
});

// ---------- Quick modal ----------
const backdrop = document.getElementById('modalBackdrop');
const modalCard = document.getElementById('modalCard');

function closeIcon(){return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';}

function categoryLabel(cat){
  const c = CATS.find(c=>c.key===cat);
  return c ? c.label : cat;
}

function openQuick(z){
  const e = byZ[z];
  const discovery = e.year ? `${e.discoverer} · ${e.year}` : `${e.discoverer} · Known since antiquity`;
  modalCard.innerHTML = `
    <div class="modal-head">
      <div class="modal-head-bg" style="background:var(--c-${e.cat});"></div>
      <button class="icon-btn modal-close" id="quickClose">${closeIcon()}</button>
      <div class="modal-symbol" style="border-color:var(--c-${e.cat}); color:var(--c-${e.cat});">${e.sym}</div>
      <div class="modal-titles">
        <div class="eyebrow" style="color:var(--c-${e.cat})">${categoryLabel(e.cat)} · Z=${e.z}</div>
        <h2 class="display">${e.name}</h2>
        <div class="sub mono">Atomic mass ${e.mass} · ${e.config}</div>
      </div>
    </div>
    <div class="modal-body">
      <div class="fact-box">${e.fact}</div>

      <div class="section-label">Physical Properties</div>
      <div class="grid2">
        <div class="stat"><div class="k">State (room temp)</div><div class="v">${e.state}</div></div>
        <div class="stat"><div class="k">Density</div><div class="v">${e.density}</div></div>
        <div class="stat"><div class="k">Melting point</div><div class="v">${e.mp}°C</div></div>
        <div class="stat"><div class="k">Boiling point</div><div class="v">${e.bp}°C</div></div>
      </div>
      <div class="stat" style="margin-top:10px;"><div class="k">Appearance</div><div class="v" style="font-family:'Inter',sans-serif;">${e.appearance}</div></div>

      <div class="section-label">Chemical Properties</div>
      <div class="grid2">
        <div class="stat"><div class="k">Valency</div><div class="v">${e.valency}</div></div>
        <div class="stat"><div class="k">Electronegativity</div><div class="v">${e.eneg}</div></div>
      </div>
      <div class="stat" style="margin-top:10px;"><div class="k">Oxidation states</div><div class="v">${e.oxidation}</div></div>

      <div class="section-label">Discovery</div>
      <div class="stat"><div class="k">Discoverer &amp; Year</div><div class="v" style="font-family:'Inter',sans-serif;">${discovery}</div></div>
      <div class="fact-box" style="margin-top:10px; font-style:normal;"><b style="color:var(--c-${e.cat});">How it was found: </b>${e.discoveryHow}</div>

      <div class="section-label">Common Uses &amp; Applications</div>
      <ul class="uses">${e.uses.map(u=>`<li>${u}</li>`).join('')}</ul>

      <button class="more-btn" id="moreBtn">More on ${e.name} <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>
    </div>
  `;
  backdrop.classList.remove('hide-instant');
  requestAnimationFrame(()=> backdrop.classList.add('show'));
  document.getElementById('quickClose').addEventListener('click', closeQuick);
  document.getElementById('moreBtn').addEventListener('click', ()=>{ closeQuick(true); openDetail(z); });
}
function closeQuick(skipHide){
  backdrop.classList.remove('show');
  setTimeout(()=>{ if(!skipHide) backdrop.classList.add('hide-instant'); else backdrop.classList.add('hide-instant'); }, 220);
}
backdrop.addEventListener('click', (ev)=>{ if(ev.target === backdrop) closeQuick(); });
document.addEventListener('keydown', (ev)=>{
  if(ev.key === 'Escape'){
    closeQuick();
    closeDetail();
  }
});

// ---------- Detail (full) view ----------
const detailBackdrop = document.getElementById('detailBackdrop');
const detailWrap = document.getElementById('detailWrap');
let currentDetailZ = null;

function relatedElements(e){
  // same category, nearest by Z, excluding self; also same group if available
  return DATA.filter(x=>x.cat===e.cat && x.z!==e.z)
    .sort((a,b)=> Math.abs(a.z-e.z) - Math.abs(b.z-e.z))
    .slice(0,6);
}

function allReactions(){
  // flatten reaction db across all elements with element ref
  const list = [];
  DATA.forEach(e=>{
    (e.reactions||[]).forEach(r=>{
      list.push({z:e.z, sym:e.sym, name:e.name, cat:e.cat, eq:r.eq, cond:r.cond, note:r.note});
    });
  });
  return list;
}
const REACTIONS = allReactions();

function renderReactions(containerId, filterZ){
  const searchId = containerId+'-search';
  const selectId = containerId+'-select';
  const listId = containerId+'-list';
  const countId = containerId+'-count';

  function paint(){
    const q = (document.getElementById(searchId).value||'').toLowerCase();
    const elFilter = document.getElementById(selectId).value;
    let rows = REACTIONS;
    if(filterZ) rows = rows.filter(r=>r.z===filterZ);
    if(elFilter) rows = rows.filter(r=> r.sym === elFilter);
    if(q) rows = rows.filter(r=> r.eq.toLowerCase().includes(q) || r.note.toLowerCase().includes(q) || r.name.toLowerCase().includes(q));
    document.getElementById(countId).textContent = `${rows.length} reaction${rows.length!==1?'s':''} found`;
    document.getElementById(listId).innerHTML = rows.length ? rows.map(r=>`
      <div class="rxn-item">
        <div class="rxn-eq">${r.eq}</div>
        <div class="rxn-meta">
          <span><b>Element:</b> ${r.name} (${r.sym})</span>
          <span><b>Conditions:</b> ${r.cond}</span>
          <span><b>Notes:</b> ${r.note}</span>
        </div>
      </div>`).join('') : `<div class="rxn-empty">No reactions match your search.</div>`;
  }
  document.getElementById(searchId).addEventListener('input', paint);
  document.getElementById(selectId).addEventListener('change', paint);
  paint();
}

function detailHTML(e){
  const related = relatedElements(e);
  const uniqueSyms = [...new Set(DATA.map(x=>x.sym))].sort();
  const discovery = e.year ? `Discovered by ${e.discoverer} in ${e.year}.` : `Known since antiquity; associated with early work by ${e.discoverer}.`;

  return `
    <div class="detail-topbar">
      <div class="back-link" id="detailBack">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to periodic table
      </div>
      <button class="icon-btn" id="detailClose">${closeIcon()}</button>
    </div>

    <div class="detail-hero">
      <div class="detail-symbol" style="border-color:var(--c-${e.cat}); color:var(--c-${e.cat}); background:color-mix(in srgb, var(--c-${e.cat}) 12%, transparent);">${e.sym}</div>
      <div>
        <div class="eyebrow" style="color:var(--c-${e.cat})">${categoryLabel(e.cat)} · Atomic Number ${e.z}</div>
        <h1 class="display">${e.name}</h1>
        <div class="sub mono">${e.config} · Mass ${e.mass} · ${e.state}</div>
      </div>
    </div>

    <div class="tabs" id="detailTabs">
      <div class="tab active" data-tab="overview">Overview</div>
      <div class="tab" data-tab="isotopes">Isotopes</div>
      <div class="tab" data-tab="reactions">Reaction Database</div>
      <div class="tab" data-tab="related">Related Elements</div>
    </div>

    <div class="tab-panel active" data-panel="overview">
      <div class="two-col">
        <div class="card">
          <h3>Fun Fact</h3>
          <p>${e.fact}</p>
        </div>
        <div class="card">
          <h3>Historical Background — How It Was Discovered</h3>
          <p>${e.discoveryHow}</p>
        </div>
      </div>
      <div class="two-col">
        <div class="card">
          <h3>Natural Occurrence &amp; Abundance</h3>
          <p>${e.occurrence}</p>
        </div>
        <div class="card">
          <h3>Biological Importance</h3>
          <p>${e.biological}</p>
        </div>
      </div>
      <div class="two-col">
        <div class="card">
          <h3>Industrial &amp; Laboratory Applications</h3>
          <ul class="uses">${e.uses.map(u=>`<li>${u}</li>`).join('')}</ul>
        </div>
        <div class="card">
          <h3>Safety Hazards &amp; Handling</h3>
          <p>${e.hazards}</p>
        </div>
      </div>
      <div class="card">
        <h3>Full Property Sheet</h3>
        <div class="grid2">
          <div class="stat"><div class="k">Symbol</div><div class="v">${e.sym}</div></div>
          <div class="stat"><div class="k">Atomic Number</div><div class="v">${e.z}</div></div>
          <div class="stat"><div class="k">Atomic Mass</div><div class="v">${e.mass}</div></div>
          <div class="stat"><div class="k">Electron Config.</div><div class="v">${e.config}</div></div>
          <div class="stat"><div class="k">Period / Group</div><div class="v">${e.per} / ${e.grp}</div></div>
          <div class="stat"><div class="k">Block</div><div class="v">${e.block}-block</div></div>
          <div class="stat"><div class="k">Density</div><div class="v">${e.density}</div></div>
          <div class="stat"><div class="k">Melting Point</div><div class="v">${e.mp}°C</div></div>
          <div class="stat"><div class="k">Boiling Point</div><div class="v">${e.bp}°C</div></div>
          <div class="stat"><div class="k">Electronegativity</div><div class="v">${e.eneg}</div></div>
          <div class="stat"><div class="k">Valency</div><div class="v">${e.valency}</div></div>
          <div class="stat"><div class="k">Oxidation States</div><div class="v">${e.oxidation}</div></div>
        </div>
      </div>
    </div>

    <div class="tab-panel" data-panel="isotopes">
      <div class="card">
        <h3>Known Isotopes</h3>
        <table class="iso-table">
          <thead><tr><th>Isotope</th><th>Name</th><th>Abundance</th><th>Notes</th></tr></thead>
          <tbody>
            ${e.isotopes.map(i=>`<tr><td>${i.sym}</td><td>${i.name}</td><td>${i.abund}</td><td>${i.notes}</td></tr>`).join('')}
          </tbody>
        </table>
        <div class="tag-note">For a complete, continuously updated isotope table with precise half-lives and decay modes, consult NIST or IUPAC nuclear data references.</div>
      </div>
    </div>

    <div class="tab-panel" data-panel="reactions">
      <div class="card">
        <h3>Reaction Database — ${e.name}</h3>
        <p style="margin-bottom:14px;">A curated, searchable set of representative reactions involving ${e.name}. Chemistry literature documents vastly more reactions than any single reference can list; use the global database below to search across all 118 elements.</p>
        <div class="rxn-controls">
          <input id="dtl-rxn-search" type="text" placeholder="Search equations or notes…">
          <select id="dtl-rxn-select"><option value="">This element only</option></select>
        </div>
        <div class="rxn-count" id="dtl-rxn-count"></div>
        <div id="dtl-rxn-list"></div>
      </div>
    </div>

    <div class="tab-panel" data-panel="related">
      <div class="card">
        <h3>Related Elements — same category (${categoryLabel(e.cat)})</h3>
        <div class="related-grid" id="relatedGrid">
          ${related.map(r=>`<div class="related-tile" data-z="${r.z}" style="border-color:var(--c-${r.cat});">
              <div class="sym" style="color:var(--c-${r.cat});">${r.sym}</div>
              <div class="nm">${r.name}</div>
            </div>`).join('')}
        </div>
      </div>
    </div>
  `;
}

function openDetail(z){
  currentDetailZ = z;
  const e = byZ[z];
  detailWrap.innerHTML = detailHTML(e);
  detailBackdrop.classList.add('show');
  document.body.style.overflow = 'hidden';
  detailWrap.scrollTop = 0;

  document.getElementById('detailBack').addEventListener('click', closeDetail);
  document.getElementById('detailClose').addEventListener('click', closeDetail);

  document.querySelectorAll('#detailTabs .tab').forEach(t=>{
    t.addEventListener('click', ()=>{
      document.querySelectorAll('#detailTabs .tab').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      document.querySelector(`.tab-panel[data-panel="${t.getAttribute('data-tab')}"]`).classList.add('active');
    });
  });

  // populate reaction element select
  const sel = document.getElementById('dtl-rxn-select');
  const uniqueSyms = [...new Set(DATA.map(x=>x.sym))].sort();
  uniqueSyms.forEach(s=>{
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    sel.appendChild(opt);
  });
  renderReactions('dtl-rxn', e.z);

  document.querySelectorAll('.related-tile').forEach(t=>{
    t.addEventListener('click', ()=> openDetail(parseInt(t.getAttribute('data-z'))));
  });
}

function closeDetail(){
  detailBackdrop.classList.remove('show');
  document.body.style.overflow = '';
}

// ---------- init ----------
renderStrip();
renderGrid();

})();

</script>
</body>
</html>
